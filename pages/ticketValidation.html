<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar ingreso | Leal Import</title>
    <link rel="icon" type="image/x-icon" href="../media/appMedia/Logo Lealimport.png">
    <link rel="stylesheet" href="../css/globalStyles.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/utils/controls/controls.css">
    <link rel="stylesheet" href="../css/utils/loaders/loader.css">
    <link rel="stylesheet" href="../css/utils/darkMode.css">
    <link rel="stylesheet" href="../css/modules/ticketing/ticketing.css">
    <link rel="stylesheet" href="../css/modules/ticketValidation/ticketValidation.css">
    <script src="../js/utils/dark.mode.init.js"></script>
</head>

<body>
    <div class="containerMobileHeader"></div>
    <div id="darkMode" class="darkMode"></div>
    <div class="bodyContent">
        <div id="sidebar"></div>

        <main class="content ticketValidationPage">
            <header class="headerContent">
                <div class="breadCrumbSection">
                    <a class="breadcrumb">Validar ingreso</a>
                </div>
            </header>

            <section class="ticketValidationGrid" aria-label="Validación de boletos">
                <article class="ticketValidationPanel">
                    <div class="panelHeader">
                        <div>
                            <p class="panelEyebrow">Acceso al evento</p>
                            <h1 class="panelTitle">Validar boleto</h1>
                        </div>
                        <span class="panelHint">Escanea el código QR del boleto con la cámara.</span>
                    </div>

                    <div class="qrScanner" data-camera-container>
                        <video id="qrVideo" class="qrVideo hide" autoplay muted playsinline aria-label="Vista de la cámara para escanear el código QR"></video>
                        <div class="qrScannerPlaceholder show" data-camera-placeholder>
                            <svg class="qrScannerIcon" width="68" height="68" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M3 7V4a1 1 0 0 1 1-1h3"></path>
                                <path d="M17 3h3a1 1 0 0 1 1 1v3"></path>
                                <path d="M21 17v3a1 1 0 0 1-1 1h-3"></path>
                                <path d="M7 21H4a1 1 0 0 1-1-1v-3"></path>
                                <rect x="8" y="8" width="8" height="8" rx="1"></rect>
                            </svg>
                            <div class="qrScannerStatus">
                                <strong>Cámara apagada</strong>
                                <span>Actívala para leer el QR desde el dispositivo.</span>
                            </div>
                        </div>
                    </div>

                    <div class="ticketValidationActions">
                        <button id="btnStartCamera" class="btnPrimary" type="button">
                            <svg class="buttonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M4 7h3l1.5-2h3L13 7h3a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"></path>
                                <circle cx="10" cy="13" r="3"></circle>
                            </svg>
                            Activar cámara
                        </button>
                        <button id="btnStopCamera" class="btnSecondary hide" type="button">
                            <svg class="buttonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="9"></circle>
                                <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"></rect>
                            </svg>
                            Detener cámara
                        </button>
                    </div>

                    <p id="cameraMessage" class="ticketValidationMessage" role="status" aria-live="polite"></p>
                </article>

            </section>

            <section id="validationResult" class="validationResult hide" aria-live="polite" aria-atomic="true"></section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/modules/ticketValidation/ticketValidation.controller.js"></script>
    <script type="module" src="../js/components/sidebar.js"></script>
</body>

</html>
